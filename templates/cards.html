<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог компонентов</title>
    <link rel="stylesheet" href="/static/css/style.css?v=5">
</head>
<body>
    <div class="cards-container">
        <h1 class="page-title">Каталог компонентов</h1>

        <form action="/server-components/cards" method="GET" class="filter-form">
            <div class="filter-row">
                <input type="text" name="query" value="{{ .query }}" placeholder="Поиск по названию...">
                <input type="number" name="min_tdp" value="{{ .min_tdp }}" placeholder="Мин. TDP (Вт)..." min="0">
                <button type="submit">Найти</button>
            </div>
            {{ if or .query .min_tdp }}
            <a href="/server-components/cards" class="clear-filter">Сбросить фильтры</a>
            {{ end }}
        </form>

        <div class="cards-grid two-column">
            {{ range .serverComponents }}
            <div class="card">
                <a href="/server-components/feed/{{ .Component.ID }}" class="card-link">
                    
                    <img src="{{ .Component.ImageURL }}" alt="{{ .Component.Name }}" class="card-image" onerror="this.onerror=null;this.src='/static/img/default.jpg';">
                </a>
                <div class="card-content">
                    <h3 class="card-title">{{ .Component.Name }}</h3>
                    <div class="card-params">
                        <span class="card-type">{{ .Component.ComponentType }}</span>
                        <span class="card-tdp">{{ .Component.TDP }} Вт</span>
                    </div>
                    <div class="card-bottom">
                        <div class="card-like-badge">
                            <svg class="heart-icon-small" viewBox="0 0 24 24">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                            <span>{{ .Likes }}</span>
                        </div>

                        <form action="/server-components/delete/{{ .Component.ID }}" method="POST" class="delete-card-form" onsubmit="return confirm('Вы действительно хотите удалить эту услугу?');">
                            <button type="submit" class="card-delete-button" title="Удалить услугу">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            {{ else }}
            <p class="empty-hint">Опубликованные компоненты не найдены</p>
            {{ end }}
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/server-components/feed" class="nav-item">
            <span>Лента</span>
        </a>
        <a href="/server-components/add" class="nav-item">
            <span>Добавление</span>
        </a>
        <a href="/server-components/cards" class="nav-item active">
            <span>Плитка</span>
        </a>
    </nav>
</body>
</html>
