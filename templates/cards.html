<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог компонентов</title>
    <link rel="stylesheet" href="/static/css/style.css?v=3">
</head>
<body>
    <div class="cards-container">
        <h1 class="page-title">Каталог компонентов</h1>

        <form action="/server-components/cards" method="GET" class="filter-form">
            <label>Минимальный TDP (Вт):</label>
            <input type="number" name="min_tdp" value="{{ .query }}" placeholder="Например: 200">
            <button type="submit">Фильтровать</button>
            {{ if .query }}
            <a href="/server-components/cards" class="clear-filter">Сбросить</a>
            {{ end }}
        </form>

        <div class="cards-grid two-column">
            {{ range .serverComponents }}
            <div class="card">
                <a href="/server-components/feed/{{ .Service.ID }}" class="card-link">
                    <img src="{{ .Service.ImageURL }}" alt="{{ .Service.Name }}" class="card-image">
                </a>
                <div class="card-content">
                    <h3 class="card-title">{{ .Service.Name }}</h3>
                    <div class="card-params">
                        <span class="card-type">{{ .Service.Type }}</span>
                        <span class="card-tdp">{{ .Service.TDP }} Вт</span>
                    </div>
                    <div class="card-bottom">
                        <!-- Лайк в карточке: без рамки, только сердечко и цифра -->
                        <form action="/server-components/like/{{ .Service.ID }}" method="POST" class="like-form" style="display: inline-flex; margin: 0; padding: 0; border: none; background: transparent;">
                            <button type="submit" class="card-like-button {{ if .Liked }}liked{{ end }}" style="background: transparent; border: none; outline: none; box-shadow: none; padding: 0; margin: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; color: var(--color-brown);">
                                <svg class="heart-icon-small" viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: {{ if .Liked }}#e03030{{ else }}rgba(43,37,34,0.4){{ end }};">
                                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                                </svg>
                                <span style="font-size: 13px; font-weight: 500;">{{ .Likes }}</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            {{ end }}
        </div>
    </div>

    <!-- Панель навигации в ту же ширину, что и основная часть (420px) -->
    <nav class="bottom-nav" style="position: fixed; bottom: 0; left: 50%; right: auto; transform: translateX(-50%); width: 100%; max-width: 420px; box-sizing: border-box;">
        <a href="/server-components/feed" class="nav-item">
            <span>Лента</span>
        </a>
        <a href="/server-components/add" class="nav-item">
            <span>Добавление</span>
        </a>
        <a href="/server-components/cards" class="nav-item active">
            <span>Плитка</span>
        </a>
    </nav>
</body>
</html>
